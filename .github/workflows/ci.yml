name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    name: 后端自检（渠道契约 / 适配规则 / 编排，不联网不投递）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/papercast-server/requirements.lock.txt
      - name: 安装依赖（精确锁版）
        run: pip install -r apps/papercast-server/requirements.lock.txt
      - name: 安装测试依赖（pytest）
        run: pip install -r apps/papercast-server/requirements-dev.txt
      - name: 渠道层自检
        run: python apps/papercast-server/scripts/check_channels.py
      # 只跑纯函数 / 契约用例：不起服务、不联网、不需要 chrome / ffmpeg / GPU。
      - name: 后端单测（pytest）
        run: python -m pytest -q apps/papercast-server/tests

  frontend:
    name: 前端类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/papercast/package-lock.json
      - run: npm ci --prefix apps/papercast
      - run: npm --prefix apps/papercast run typecheck

[pytest]
# 后端单测：只跑纯函数 / 契约用例，不联网、不需要 chrome / ffmpeg / GPU。
testpaths = tests
pythonpath = .
# -p no:cacheprovider：不生成 .pytest_cache（根 .gitignore 没覆盖它，别在仓库里留未跟踪噪音；
# pytest 9 已不认 cache_dir 这个 ini 项，直接关掉缓存最省事）
# 不写 -q：让调用方自己决定（README / CI 用 -q；再叠一次 -q 会把最后的 passed 汇总行也吃掉）
addopts = -ra -p no:cacheprovider
